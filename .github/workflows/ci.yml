name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Portable Go race tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - run: go test -race -count=2 -timeout=3m ./internal/core
      - run: go vet ./internal/core

  frontend:
    name: TypeScript and UI tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Packaging and evidence tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  dependencies:
    name: Dependency release gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit full and production dependency trees
        run: python scripts/check_npm_audit.py
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f artifacts/dependency-audit/SUMMARY.md ]; then
            cat artifacts/dependency-audit/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: artifacts/dependency-audit/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows build and unsigned demo package
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [core, frontend, python]
    # Build evidence remains useful when the separate audit is red.
    # The draft-release caller still requires ALL jobs to succeed.
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Verify generated bindings
        shell: pwsh
        run: |
          wails3 task bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            $bindingsExitCode = $LASTEXITCODE
            git ls-files --eol -- frontend/bindings
            exit $bindingsExitCode
          }
      - name: Build complete production package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          wails3 task package *> artifacts/windows-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/windows-build.log; exit $LASTEXITCODE }
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            $bindingsExitCode = $LASTEXITCODE
            git ls-files --eol -- frontend/bindings
            exit $bindingsExitCode
          }
      - name: Native Windows tests and vet (no external peers)
        shell: pwsh
        run: |
          go test -tags production -timeout=3m ./... *> artifacts/windows-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/windows-tests.log; exit $LASTEXITCODE }
          go vet -tags production ./... *> artifacts/windows-vet.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/windows-vet.log; exit $LASTEXITCODE }
      - name: Package allowlisted files with source and hashes
        shell: pwsh
        run: |
          python scripts/package_demo.py --bin bin --output dist-demo
          if ($LASTEXITCODE -ne 0) {
            $packageExitCode = $LASTEXITCODE
            git status --short --untracked-files=all
            git diff -- frontend/bindings
            git ls-files --eol -- frontend/bindings
            exit $packageExitCode
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-mini-demo-${{ github.sha }}
          path: dist-demo/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-checks-${{ github.sha }}
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 14
