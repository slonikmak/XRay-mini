name: Draft demo release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  draft:
    name: Create an unsigned draft prerelease
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xray-mini-demo-${{ github.sha }}
          path: dist-demo
      - name: Verify archived bytes
        working-directory: dist-demo
        run: sha256sum -c SHA256SUMS
      - name: Create draft targeting the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          cp docs/DEMO-RELEASE.md release-notes.md
          printf '\nSource commit: `%s`\nCI run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$tag" dist-demo/*.zip dist-demo/SHA256SUMS \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Xray Mini demo ${GITHUB_SHA:0:12}" --notes-file release-notes.md
