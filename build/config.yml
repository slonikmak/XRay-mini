version: '3'
info:
  companyName: Xray Mini
  productName: Xray Mini
  productIdentifier: com.xraymini.client
  description: Experimental local Xray proxy client
  version: 0.1.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, .task]
    file: [.DS_Store, .gitignore, '*_test.go', '*.syso']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
